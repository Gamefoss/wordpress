name: Deploy to FTP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: wordpress-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Publish
      if: github.event_name == 'push'
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        server: ftp.gamefoss.com.br
        username: ${{ secrets.SFTP_USERNAME }}
        password: ${{ secrets.SFTP_PASSWORD }}
        local-dir: ./wp-content/themes/gamefoss/
        server-dir: /wp-content/themes/gamefoss/
